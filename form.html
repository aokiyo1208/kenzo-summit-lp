<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>満員御礼・申込終了｜KENZO SUMMIT 2026</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --ink: #1d1d1f;
            --ink-2: #6e6e73;
            --ink-3: #86868b;
            --paper: #ffffff;
            --paper-2: #f5f5f7;
            --black: #000000;
            --blue: #0071e3;
            --hairline: rgba(0, 0, 0, 0.12);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro JP', 'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Yu Gothic UI', 'Yu Gothic', sans-serif;
            font-size: 17px;
            line-height: 1.7;
            color: var(--ink);
            background: var(--paper-2);
            -webkit-font-smoothing: antialiased;
        }

        .top {
            background: var(--black);
            color: #f5f5f7;
            text-align: center;
            padding: 56px 22px 48px;
        }

        .top a.back {
            color: #a1a1a6;
            font-size: 14px;
            text-decoration: none;
        }

        .top a.back:hover { color: #f5f5f7; }

        .top h1 {
            font-size: clamp(28px, 5vw, 40px);
            font-weight: 700;
            letter-spacing: -0.01em;
            margin-top: 10px;
        }

        .top p {
            color: #a1a1a6;
            font-size: 15px;
            margin-top: 8px;
        }

        .card {
            max-width: 640px;
            margin: 40px auto 64px;
            background: var(--paper);
            border-radius: 28px;
            padding: 40px 36px 44px;
        }

        .field { margin-bottom: 24px; }

        .field label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 7px;
        }

        .field label .req {
            color: var(--blue);
            font-weight: 600;
            margin-left: 4px;
            font-size: 12px;
        }

        .field input[type="text"],
        .field input[type="email"],
        .field input[type="tel"],
        .field textarea {
            width: 100%;
            font: inherit;
            font-size: 16px;
            padding: 11px 14px;
            border: 1px solid var(--hairline);
            border-radius: 12px;
            background: var(--paper);
            color: var(--ink);
        }

        .field input:focus, .field textarea:focus {
            outline: none;
            border-color: var(--blue);
            box-shadow: 0 0 0 3px rgba(0, 113, 227, 0.18);
        }

        .choices { display: flex; flex-wrap: wrap; gap: 10px; }

        .choices input { position: absolute; opacity: 0; pointer-events: none; }

        .choices label.chip {
            display: inline-block;
            padding: 9px 18px;
            border: 1px solid var(--hairline);
            border-radius: 980px;
            font-size: 15px;
            font-weight: 500;
            cursor: pointer;
            margin: 0;
            color: var(--ink);
        }

        .choices input:checked + label.chip {
            background: var(--blue);
            border-color: var(--blue);
            color: #fff;
        }

        .choices input:focus-visible + label.chip {
            outline: 3px solid rgba(0, 113, 227, 0.4);
            outline-offset: 2px;
        }

        .name-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .note {
            font-size: 13px;
            color: var(--ink-3);
            margin-top: 6px;
        }

        .btn {
            display: block;
            width: 100%;
            background: var(--blue);
            color: #fff;
            font: inherit;
            font-size: 17px;
            font-weight: 500;
            padding: 14px;
            border: none;
            border-radius: 980px;
            cursor: pointer;
            margin-top: 32px;
            transition: background 0.25s ease;
        }

        .btn:hover { background: #0077ed; }
        .btn:focus-visible { outline: 3px solid #4dc4ff; outline-offset: 3px; }

        .hint {
            text-align: center;
            font-size: 13px;
            color: var(--ink-3);
            margin-top: 14px;
        }

        .fallback {
            display: none;
            margin-top: 24px;
            border-top: 1px solid var(--hairline);
            padding-top: 20px;
        }

        .fallback.show { display: block; }

        .fallback p { font-size: 14px; color: var(--ink-2); margin-bottom: 10px; }

        .fallback textarea {
            width: 100%;
            font-size: 13px;
            font-family: inherit;
            padding: 12px;
            border: 1px solid var(--hairline);
            border-radius: 12px;
            background: var(--paper-2);
            min-height: 180px;
            color: var(--ink);
        }

        .fallback .copy {
            margin-top: 10px;
            background: var(--ink);
            color: #fff;
            font: inherit;
            font-size: 14px;
            font-weight: 500;
            padding: 9px 20px;
            border: none;
            border-radius: 980px;
            cursor: pointer;
        }

        .done {
            display: none;
            margin-top: 24px;
            padding: 18px 20px;
            border-radius: 14px;
            background: #e8f5ec;
            color: #1d7a3a;
            font-size: 15px;
            line-height: 1.8;
        }

        .done.show { display: block; }

        .err {
            display: none;
            color: #d70015;
            font-size: 14px;
            font-weight: 500;
            margin-top: 14px;
            text-align: center;
        }

        .err.show { display: block; }

        footer {
            text-align: center;
            font-size: 12px;
            color: var(--ink-3);
            padding: 0 22px 40px;
            line-height: 1.9;
        }
    </style>
</head>
<body>
    <div class="top">
        <a class="back" href="index.html">← KENZO SUMMIT 2026</a>
        <h1>満員御礼・申込終了</h1>
        <p>2026.11.10（火）14:00–17:00｜東京・飯田橋</p>
    </div>
    <main class="card">
        <h2>お申し込みの受付は終了しました</h2>
        <p>定員に達したため、会場・オンラインともにお申し込みの受付を終了しました。</p>
        <p>たくさんのお申し込みをありがとうございました。</p>
        <p><a href="index.html">イベント概要に戻る</a></p>
    </main>
    <footer>
        <div>KENZO SUMMIT 2026｜主催：株式会社KENZO</div>
        <div>お問い合わせ：contact@kenzo.tech</div>
    </footer>
</body>
</html>
